# Dates are relative to today so the fixtures never end up in the past.

anna_confirmed:
  house: casa
  user: anna
  decided_by: manager
  arrival_on: <%= Date.current + 14 %>
  departure_on: <%= Date.current + 21 %>
  guests_count: 4
  status: confirmed
  decided_at: <%= Time.current.to_fs(:db) %>

ben_requested:
  house: casa
  user: ben
  arrival_on: <%= Date.current + 30 %>
  departure_on: <%= Date.current + 35 %>
  guests_count: 2
  status: requested

# Overlaps ben_requested: only one of the two can be confirmed.
anna_overlapping_request:
  house: casa
  user: anna
  arrival_on: <%= Date.current + 33 %>
  departure_on: <%= Date.current + 37 %>
  guests_count: 3
  status: requested
